name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Dataset
        run: python tourism_project/model_building/validate_data.py

      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          api.create_repo(
              repo_id=f"{os.environ['HF_USERNAME']}/tourism-dataset",
              repo_type="dataset",
              exist_ok=True,
              token=os.environ["HF_TOKEN"],
          )
          api.upload_file(
              path_or_fileobj="tourism_project/data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id=f"{os.environ['HF_USERNAME']}/tourism-dataset",
              repo_type="dataset",
              token=os.environ["HF_TOKEN"],
          )
          print("Dataset uploaded to Hugging Face Hub.")
          EOF

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/data_prep.py

      - name: Upload Train/Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: tourism_project/model_building/artifacts/

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Train/Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: tourism_project/model_building/artifacts/

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      - name: Model Building
        run: python tourism_project/model_building/train_model.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            tourism_project/deployment/model.pkl
            tourism_project/deployment/feature_columns.pkl

  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt huggingface_hub

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment/

      - name: Push Files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          python - <<'EOF'
          import os
          import sys
          from huggingface_hub import HfApi, HfHubHTTPError

          api = HfApi()
          repo_id = f"{os.environ['HF_USERNAME']}/tourism-predictor"

          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
                  token=os.environ["HF_TOKEN"],
              )
              api.upload_folder(
                  folder_path="tourism_project/deployment",
                  repo_id=repo_id,
                  repo_type="space",
                  token=os.environ["HF_TOKEN"],
              )
              print("Deployment files pushed to Hugging Face Space.")
          except HfHubHTTPError as e:
              if e.response.status_code == 402:
                  print("Hugging Face returned 402 Payment Required. Hosting Docker Spaces on free cpu-basic requires a PRO subscription. Skipping Space creation/update.")
                  # Exit gracefully without failing the job
                  sys.exit(0)
              else:
                  # Re-raise other unexpected errors
                  raise
          EOF

  push-updates:
    runs-on: ubuntu-latest
    needs: model-training
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment/

      - name: Commit and Push Model Updates to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.pkl tourism_project/deployment/feature_columns.pkl
          git diff --staged --quiet || git commit -m "Auto-update trained model [skip ci]"
          git push
